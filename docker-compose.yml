services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: appsport
      POSTGRES_USER: appsport
      POSTGRES_PASSWORD: appsport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsport"]
      interval: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://appsport:appsport@db:5432/appsport
      DJANGO_ALLOWED_HOSTS: "*"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
