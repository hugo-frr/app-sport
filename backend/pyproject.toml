[project]
name = "app-sport-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"apps/*/views.py" = ["B904"]
"apps/*/serializers.py" = ["B904"]
"tests/*" = ["B017"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
